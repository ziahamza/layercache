name: Layer Cache native artifacts
description: Reuse verified native artifacts from local development or CI before allocating a build runner.
inputs:
  operation:
    description: restore or save. A restore without path verifies the archive without extracting it.
    default: restore
  team-url:
    description: HTTPS Team Cache origin.
    required: true
  project:
    description: Project identity, defaults to github.com/owner/repo.
  compatibility:
    description: Required in source mode. In Expo mode calculated from expo-target; an explicit value must match.
  key-mode:
    description: source (default) or expo (shared Expo iOS Debug simulator identity).
    default: source
  expo-root:
    description: Installed Expo app directory relative to workspace. Required dependencies must already be installed.
    default: '.'
  expo-app:
    description: App identity matching the Expo provider options.app; required in Expo mode.
  expo-scheme:
    description: Exact scheme passed to expo run ios. Omit on both CI and local builds for the Expo default.
  expo-target:
    description: JSON target with os=darwin, arch=arm64 or x64, exact xcodebuild -version output, and iphonesimulator SDK build as sdk. Verified on macOS; required in Expo mode.
  key:
    description: Build identity. Defaults to all Git source names/modes/contents, including dirty files. Supply build-affecting environment through compatibility.
  path:
    description: Build file/directory to save, or a new directory to restore into.
  max-bytes:
    description: Maximum local archive cache bytes.
    default: '5368709120'
outputs:
  compatibility:
    description: Resolved compatibility identity; pass it alongside key from Linux lookup to macOS save to reject mismatches.
  key:
    description: Resolved source key. Pass this from the Linux lookup job to the build job save step.
  cache-hit:
    description: True only after downloading and verifying the complete archive.
  source:
    description: local, team, miss, or degraded.
  digest:
    description: Verified archive SHA-256.
  elapsed-ms:
    description: Time spent on the cache operation, not an estimate of compute saved.
runs:
  using: node24
  main: dist/main.cjs
