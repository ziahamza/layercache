name: Layer Cache
description: Restore and save GitHub Actions archives through the Layer Cache v1 Team Cache endpoint.
author: Layer Cache

inputs:
  path:
    description: Files, directories, and glob patterns to restore and save, one per line.
    required: true
  key:
    description: Primary cache key.
    required: true
  restore-keys:
    description: Ordered key prefixes to try after the primary key, one per line.
    required: false
  lookup-only:
    description: Check for a matching entry without downloading it or saving in the post action.
    required: false
    default: "false"
  fail-on-cache-miss:
    description: Fail the action when no matching entry exists.
    required: false
    default: "false"
  endpoint:
    description: Layer Cache v1 endpoint. Use HTTPS, or HTTP only for a loopback daemon.
    required: true
  project:
    description: >-
      Team Cache project used as the GitHub OIDC audience. When set, the Action requests a short-lived token
      from Layer Cache. Grant the job id-token: write.
    required: false
  token:
    description: >-
      Project-scoped Layer Cache token fallback. The Action masks it in logs. Prefer project with GitHub OIDC.
    required: false
  compatibility:
    description: >-
      Output compatibility identity. Defaults to the Node job OS and architecture plus schema1. Set this when
      libc, runtime, or toolchain ABI affects cached outputs.
    required: false
  lookup-timeout-seconds:
    description: Maximum time to wait for verified lookup response metadata.
    required: false
    default: "2"
  public-cache-mode:
    description: >-
      Public Cache restore policy. Use "verified" to require an Ed25519-signed full publication identity,
      complete archive digest verification, and safe member validation before extraction.
    required: false
    default: disabled
  public-trust-key:
    description: URL-safe base64 Ed25519 Public Cache verification key. Required in verified mode.
    required: false
  public-recipe-digest:
    description: Layer Cache-managed Action recipe digest expected in signed provenance. Required in verified mode.
    required: false
  public-platform:
    description: Signed Public Build platform. Defaults to the current runner OS and architecture.
    required: false
  public-toolchain:
    description: Signed Public Build toolchain identity. Defaults to actions/cache@6.2.0.
    required: false
  public-builder:
    description: Exact trusted Public Build builder identity. Required in verified mode.
    required: false

outputs:
  cache-hit:
    description: '"true" for an exact primary-key hit, "false" for a restore-key hit, and empty on a miss.'
  cache-primary-key:
    description: Primary key supplied to this action.
  cache-matched-key:
    description: Key that matched, or empty on a miss.

runs:
  using: node24
  main: dist/main/index.js
  post: dist/post/index.js
  post-if: success()

branding:
  icon: layers
  color: blue
