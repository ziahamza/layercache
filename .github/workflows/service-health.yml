name: Deployed service health

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: deployed-service-health
  cancel-in-progress: false

jobs:
  public-health:
    if: ${{ vars.LAYERCACHE_PUBLIC_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.13.0'
      - name: Verify public HTTPS health and certificate lifetime
        env:
          HEALTH_URL: ${{ vars.LAYERCACHE_PUBLIC_HEALTH_URL }}
        run: node deploy/pool/monitor.ts --public "$HEALTH_URL"
      - name: Diagnose public probe transport failure
        if: failure()
        env:
          HEALTH_URL: ${{ vars.LAYERCACHE_PUBLIC_HEALTH_URL }}
        run: |
          host="$(node -e 'console.log(new URL(process.env.HEALTH_URL).hostname)')"
          getent ahosts "$host" || true
          curl --verbose --silent --show-error --head --connect-timeout 5 --max-time 8 "$HEALTH_URL" || true
